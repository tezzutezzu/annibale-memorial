<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Loving Memory — Annibale D'Elia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            800: '#292524',
                            900: '#1c1917',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; }

        /* One post at a time: the page itself never scrolls. */
        body {
            background-color: #0b0a09;
            background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
            background-size: 32px 32px;
            overflow: hidden;
            color: #e7e5e4;
        }

        /* --- Image (left) ------------------------------------------------- */
        #figure {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #photo-controls[hidden] { display: none; }

        /* Handle horizontal photo swipes while keeping native vertical pans
           and pinch zoom. This applies only to the image area, not the text. */
        #photo-frame { touch-action: pan-y pinch-zoom; }

        .photo {
            position: absolute;
            inset: 0;
            margin: auto;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            outline: 1px solid rgba(255, 255, 255, 0.08);
            outline-offset: -1px;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }
        #video { pointer-events: auto; }
        .photo[hidden] { display: none; }

        /* Long posts scroll inside their column, never the page. */
        .quote {
            scrollbar-width: thin;
            scrollbar-color: #44403c transparent;
        }
        .quote::-webkit-scrollbar { width: 6px; }
        .quote::-webkit-scrollbar-thumb { background: #44403c; border-radius: 9999px; }

        kbd {
            font-family: inherit;
            font-size: 0.75rem;
            padding: 0.1rem 0.4rem;
            border: 1px solid #3f3a37;
            border-bottom-width: 2px;
            border-radius: 0.35rem;
            background: #1c1917;
            color: #a8a29e;
        }

        /* When a post has no picture the image column collapses to zero
           width, so the text takes the whole width. */
        @media (max-width: 767px) {
            .no-image #figure { display: none; }
        }
        @media (min-width: 768px) {
            .no-image { grid-template-columns: 0px 1fr !important; }
            .no-image #card { max-width: 46rem; margin-inline: auto; width: 100%; }
        }

        /* --- search ------------------------------------------------------- */
        /* Under the input on wide screens; on a phone the input is full width,
           so the panel simply matches it. */
        #results {
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            width: min(26rem, 86vw);
            overflow-x: hidden;      /* long alt-text "dates" must not widen the panel */
            /* Solid, not translucent: the post behind the panel is long text,
               and anything see-through made the results unreadable. */
            background-color: #14120f;
        }
        @media (max-width: 767px) {
            #results {
                left: 0;
                right: 0;
                width: auto;
            }
        }

        /* The searched words, marked inside the result snippets. */
        #results mark {
            background: rgba(253, 230, 138, 0.16);
            color: #fde68a;
            border-radius: 0.15rem;
            padding: 0 0.1rem;
        }
        #results::-webkit-scrollbar { width: 6px; }
        #results::-webkit-scrollbar-thumb { background: #44403c; border-radius: 9999px; }
        #results { scrollbar-width: thin; scrollbar-color: #44403c transparent; }
        #results [aria-selected="true"] { background: rgba(255, 255, 255, 0.07); }
        /* Chrome's own clear button on <input type=search> is invisible on dark. */
        #search::-webkit-search-cancel-button { filter: invert(0.6); cursor: pointer; }
    </style>
</head>
<body class="text-stone-200 antialiased">

    <div class="h-full flex flex-col">

        <!-- Header: one row on desktop, title+counter / search on phones -->
        <header class="shrink-0 w-full max-w-[1600px] mx-auto px-4 md:px-10 pt-5 md:pt-8 pb-2
                       flex flex-wrap items-center gap-x-4 gap-y-2">

                    <a href="video.html"
                       class="rounded-full border border-transparent px-2.5 py-1 text-stone-500 transition-colors
                              hover:bg-white/5 hover:text-stone-200">Video</a>
                </nav>
            </div>

            <p id="counter" class="order-2 md:order-3 text-stone-500 text-sm tabular-nums whitespace-nowrap"></p>

            <!-- Fuzzy search over the posts -->
            <div id="search-wrap" class="relative order-3 md:order-2 w-full md:w-auto shrink-0">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-500 pointer-events-none"
                     xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                </svg>
                <input id="search" type="search" autocomplete="off" spellcheck="false"
                       placeholder="Cerca un ricordo…"
                       aria-label="Cerca tra i ricordi, per testo o autore"
                       class="w-full md:w-72 bg-white/5 border border-white/10 rounded-full pl-9 pr-3 py-1.5
                              text-sm text-stone-200 placeholder:text-stone-500 outline-none
                              focus:border-white/25 focus:bg-white/10 transition-colors" />
                <div id="results" role="listbox" aria-label="Risultati"
                     class="hidden z-50 max-h-[62vh] overflow-y-auto rounded-xl border border-white/10

        <!-- Post -->
        <main class="flex-1 min-h-0 w-full max-w-[1600px] mx-auto px-4 md:px-10 pb-2">
            <div id="grid" class="h-full grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12 items-stretch">

                <!-- Image, left -->
                <figure id="figure" class="relative h-full min-h-[38vh] md:min-h-0">
                    <div id="photo-frame" class="relative flex-1 min-h-0 w-full">
                        <img id="photo" class="photo" alt="">
                        <video id="video" class="photo" controls playsinline preload="metadata" hidden
                               aria-label="Video di questo ricordo"></video>
                    </div>
                    <figcaption id="photo-controls" hidden
                                class="shrink-0 flex items-center justify-center gap-4 pt-2"
                                role="group" aria-label="Foto e video di questo ricordo">
                        <button id="photo-prev" type="button" aria-label="Contenuto precedente" aria-controls="photo video"
                                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/10
                                       bg-white/5 text-stone-300 hover:bg-white/10 focus-visible:outline focus-visible:outline-2
                                       focus-visible:outline-stone-300 disabled:opacity-25 disabled:cursor-default">
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <span id="photo-counter" class="text-sm text-stone-400 tabular-nums" aria-live="polite" aria-atomic="true"></span>
                        <button id="photo-next" type="button" aria-label="Contenuto successivo" aria-controls="photo video"
                                class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-white/10
                                       bg-white/5 text-stone-300 hover:bg-white/10 focus-visible:outline focus-visible:outline-2
                                       focus-visible:outline-stone-300 disabled:opacity-25 disabled:cursor-default">
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7" />
                            </svg>
                        </button>
                    </figcaption>
                </figure>

                <!-- Text, right -->
                <article id="card" class="h-full min-h-0 flex flex-col">
                    <blockquote id="text"
                        class="quote font-serif text-lg md:text-2xl leading-relaxed md:leading-relaxed text-stone-200 whitespace-pre-line my-auto overflow-y-auto pr-2"></blockquote>

                    <div class="mt-6 md:mt-8 pt-4 border-t border-white/10 flex items-center justify-between gap-4">
                        <div class="min-w-0">
                            <a id="author-link" href="#" target="_blank" rel="noopener noreferrer"
                               class="font-medium text-stone-100 hover:text-stone-400 transition-colors duration-200 truncate block">
                                <span id="author"></span>
                            </a>
                            <span id="date" class="block text-[0.7rem] text-stone-500 mt-1 uppercase tracking-wider"></span>
                            <div id="source-links" class="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-xs text-stone-400"></div>
                        </div>
                        <div class="shrink-0 flex items-center gap-3">
                            <button id="share" type="button"
                                    class="text-stone-600 hover:text-stone-300 transition-colors cursor-pointer"
                                    title="Copia il link a questo ricordo"
                                    aria-label="Copia il link a questo ricordo">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M13.828 10.172a4 4 0 015.656 0l1.415 1.414a4 4 0 01-5.657 5.657l-1.414-1.414M10.172 13.828a4 4 0 01-5.657 0l-1.414-1.414a4 4 0 015.657-5.657l1.414 1.414M9 15l6-6" />
                                </svg>
                            </button>
                            <a id="permalink" href="#" target="_blank" rel="noopener noreferrer"
                               class="text-stone-600 hover:text-stone-300 transition-colors"
                               title="Apri il post originale">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>
                            </a>
                        </div>
                    </div>
                </article>
            </div>
        </main>

        <!-- Footer: arrows on every screen; on desktop they sit either side of
             the key hint, on phones they go to the two outer edges. -->
        <footer class="shrink-0 w-full py-2 md:py-4 px-4 md:px-6">
            <div class="mx-auto flex w-full max-w-[1600px] items-center justify-between gap-3 md:justify-center md:gap-5">
                <button id="prev" type="button" aria-label="Ricordo precedente"
                        class="flex h-12 w-12 md:h-10 md:w-10 shrink-0 cursor-pointer items-center justify-center
                               rounded-full border border-white/10 bg-white/5 text-stone-300 transition-colors
                               hover:border-white/25 hover:bg-white/10 hover:text-stone-100
                               active:bg-white/20 disabled:cursor-default disabled:opacity-25 disabled:hover:border-white/10 disabled:hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <p id="hint" class="hidden md:block text-center text-stone-500 text-xs font-light">
                    Premi <kbd>→</kbd> per il ricordo successivo
                </p>

                <button id="next" type="button" aria-label="Ricordo successivo"
                        class="flex h-12 w-12 md:h-10 md:w-10 shrink-0 cursor-pointer items-center justify-center
                               rounded-full border border-white/10 bg-white/5 text-stone-300 transition-colors
                               hover:border-white/25 hover:bg-white/10 hover:text-stone-100
                               active:bg-white/20 disabled:cursor-default disabled:opacity-25 disabled:hover:border-white/10 disabled:hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Confirmation for "copy link" -->
    <div id="toast" aria-live="polite"
         class="pointer-events-none fixed inset-x-0 bottom-16 z-[60] flex justify-center
                opacity-0 transition-opacity duration-200">
        <span class="rounded-full border border-white/10 bg-white/10 px-3 py-1.5 text-xs
                     text-stone-200 shadow-lg shadow-black/40 backdrop-blur"></span>
    </div>

    <script>
        // Same store the gallery reads: one JSON object per line, written by
        // import_console_dump.py. A plain JSON array is accepted too.
        const DATA_URL = 'data/posts.jsonl';

        const els = {
            grid: document.getElementById('grid'),
            figure: document.getElementById('figure'),
            photo: document.getElementById('photo'),
            video: document.getElementById('video'),
            photoFrame: document.getElementById('photo-frame'),
            photoControls: document.getElementById('photo-controls'),
            photoPrev: document.getElementById('photo-prev'),
            photoNext: document.getElementById('photo-next'),
            photoCounter: document.getElementById('photo-counter'),
            card: document.getElementById('card'),
            text: document.getElementById('text'),
            author: document.getElementById('author'),
            authorLink: document.getElementById('author-link'),
            date: document.getElementById('date'),
            permalink: document.getElementById('permalink'),
            sourceLinks: document.getElementById('source-links'),
            counter: document.getElementById('counter'),
            hint: document.getElementById('hint'),
            prev: document.getElementById('prev'),
            next: document.getElementById('next'),
            search: document.getElementById('search'),
            searchWrap: document.getElementById('search-wrap'),
            results: document.getElementById('results'),
            share: document.getElementById('share'),
            toast: document.getElementById('toast'),
        };

        const state = { posts: [], i: 0, photoIndex: 0 };

        function parsePosts(text) {
            const trimmed = text.trim();
            if (!trimmed) return [];
            if (trimmed.startsWith('[')) return JSON.parse(trimmed);                  // JSON array
            return trimmed.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)); // JSONL
        }

        async function loadPosts() {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status} per ${DATA_URL}`);
            return parsePosts(await res.text());
        }

        /* ---------------------------------------------------------------- date --
           `time_text` is Facebook's own stamp ("3 h", "24 ottobre 2026"). The
           2026 build sometimes put the image description in that field instead
           ("May be an image of…"), and older scrapes also let video durations
           through. Neither is a date, so it is checked before being shown: a
           wrong date is worse than no date. */
        const TIME_LABEL_RE = /^(?:\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?|\d{4}-\d{2}-\d{2}|oggi|ieri|yesterday|just now|\d+\s*(?:s|m|min|h|d|g|gg|ore|ora|giorni?|settimane?|mesi|anni|minutes?|hours?|days?|weeks?|months?|years?)(?:\s+(?:ago|fa))?)$/i;
        const MONTH_RE = /\b(?:gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
        const NOT_A_DATE_RE = /^(?:may be|might be|could be|potrebbe essere|no photo description|nessuna descrizione)/i;

        function dateLabel(post) {
            const raw = (post.time_text || '').trim();
            const published = post.published_at || '';
            if ((!raw || NOT_A_DATE_RE.test(raw)) && /^\d{4}-\d{2}-\d{2}/.test(published)) return published.slice(0, 10);
            if (!raw || raw.length > 40) return '';
            if (NOT_A_DATE_RE.test(raw)) return '';
            if (TIME_LABEL_RE.test(raw)) return raw;
            if (/\d/.test(raw) && MONTH_RE.test(raw)) return raw;   // "24 ottobre 2026"
            return '';
        }

        /** Pick the fields the view needs; drop rows with neither words nor picture. */
        function normalise(posts) {
            return posts
                // Relevance is a flag, not a deletion: flagged rows stay in the
                // data and come back by clearing `relevant`.
                .filter(post => post.relevant !== false)
                .map(post => {
                    const media = (post.media || [])
                        .filter(m => (m.type === 'image' && (m.local_path || m.url))
                            || (m.type === 'video' && (m.local_path || /^https?:/.test(m.url || ''))))
                        .map(m => ({ type: m.type, src: m.local_path || m.url, alt: m.alt || '',
                            poster: m.poster_local_path || m.poster || '' }));
                    const images = (post.media || [])
                        .filter(m => m.type === 'image' && (m.local_path || m.url))
                        .map(m => ({ src: m.local_path || m.url, alt: m.alt || '' }));
                    // A share often names Annibale only in the quoted post; without
                    // this the slide loses the only mention.
                    const own = (post.text || '').trim();
                    const shared = (post.shared_text || '').trim();
                    const quoted = shared
                        ? '\n\n↪ ' + (post.shared_author ? post.shared_author + ': ' : '') + shared
                        : '';
                    return {
                        id: post.id,          // the slide's address: .../#<id>
                        aliases: post.aliases || [],
                        text: own + quoted,
                        author: post.author || 'Anonimo',
                        authorUrl: post.author_url && post.author_url !== '#' ? post.author_url : null,
                        permalink: post.permalink || (post.sources || []).find(s => s.permalink)?.permalink || null,
                        sources: post.sources || [{ platform: post.platform || 'facebook',
                            author: post.author || '', permalink: post.permalink || '' }],
                        sourceAuthors: (post.sources || []).map(s => s.author || '').join(' '),
                        media,
                        images,
                        image: images.length ? images[0].src : (media.find(m => m.poster)?.poster || null),
                        // Only a real post date; empty means "show nothing".
                        // (collected_at is the day of the scrape, not the post.)
                        date: dateLabel(post),
                    };
                })
                .filter(p => p.text || p.media.length);
        }

        function preload(post, photoIndex = 0) {
            const item = post && post.media[photoIndex];
            if (item?.type === 'image') new Image().src = item.src;
            else if (item?.poster) new Image().src = item.poster;
        }

        function renderPhoto() {
            const post = state.posts[state.i];
            if (!post) return;
            const item = post.media[state.photoIndex];
            const isVideo = item?.type === 'video';
            els.grid.classList.toggle('no-image', !item);
            els.photo.hidden = !item || isVideo;
            els.video.hidden = !isVideo;
            // Leaving a video must stop its audio and release the old resource.
            if (!isVideo || els.video.getAttribute('src') !== item.src) {
                els.video.pause();
                els.video.removeAttribute('src');
                els.video.removeAttribute('poster');
                els.video.load();
            }
            if (isVideo) {
                if (els.video.getAttribute('src') !== item.src) els.video.src = item.src;
                if (item.poster) els.video.poster = item.poster;
                els.video.setAttribute('aria-label', `Video del ricordo di ${post.author}`);
                els.photo.removeAttribute('src');
                els.photo.alt = '';
            } else if (item) {
                els.photo.src = item.src;
                els.photo.alt = item.alt;
            } else {
                els.photo.removeAttribute('src');
                els.photo.alt = '';
            }

            els.photoControls.hidden = post.media.length <= 1;
            els.photoPrev.disabled = state.photoIndex <= 0;
            els.photoNext.disabled = state.photoIndex >= post.media.length - 1;
            els.photoCounter.textContent = post.media.length > 1
                ? `${isVideo ? 'Video' : 'Foto'} ${state.photoIndex + 1} / ${post.media.length}` : '';
            preload(post, state.photoIndex + 1);
        }

        function goPhoto(index) {
            const post = state.posts[state.i];
            if (!post || !post.media.length) return;
            const next = Math.max(0, Math.min(index, post.media.length - 1));
            if (next === state.photoIndex) return;
            state.photoIndex = next;
            renderPhoto();
        }

        els.photoPrev.addEventListener('click', () => goPhoto(state.photoIndex - 1));
        els.photoNext.addEventListener('click', () => goPhoto(state.photoIndex + 1));

        let photoSwipe = null;
        els.photoFrame.addEventListener('pointerdown', (event) => {
            if (event.pointerType !== 'touch') return;
            photoSwipe = null;
            if (event.target.closest('video')) return;
            const post = state.posts[state.i];
            if (!event.isPrimary || !post || post.media.length < 2) return;
            photoSwipe = {
                pointerId: event.pointerId,
                x: event.clientX,
                y: event.clientY,
                post,
                photoIndex: state.photoIndex,
            };
            els.photoFrame.setPointerCapture(event.pointerId);
        });
        els.photoFrame.addEventListener('pointerup', (event) => {
            const swipe = photoSwipe;
            photoSwipe = null;
            if (!swipe || swipe.pointerId !== event.pointerId
                || swipe.post !== state.posts[state.i]
                || swipe.photoIndex !== state.photoIndex) return;
            const dx = event.clientX - swipe.x;
            const dy = event.clientY - swipe.y;
            // Ignore taps, short movements and predominantly vertical gestures.
            if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            goPhoto(state.photoIndex + (dx < 0 ? 1 : -1));
        });
        const cancelPhotoSwipe = () => { photoSwipe = null; };
        els.photoFrame.addEventListener('pointercancel', cancelPhotoSwipe);
        els.photoFrame.addEventListener('lostpointercapture', cancelPhotoSwipe);

        // Arrow keys on the gallery controls change photos; elsewhere they
        // keep navigating memories. Enter/Space activate the focused button.
        els.photoControls.addEventListener('keydown', (event) => {
            if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
            event.preventDefault();
            event.stopPropagation();
            goPhoto(state.photoIndex + (event.key === 'ArrowRight' ? 1 : -1));
        });

        function applyPostMeta(post) {
            // textContent, so nothing written on Facebook is treated as markup.
            els.text.textContent = post.text;
            els.text.scrollTop = 0;

            els.author.textContent = post.author;
            if (post.authorUrl) {
                els.authorLink.href = post.authorUrl;
                els.authorLink.classList.remove('pointer-events-none');
            } else {
                els.authorLink.removeAttribute('href');
                els.authorLink.classList.add('pointer-events-none');
            }

            els.date.textContent = post.date || '';
            els.date.classList.toggle('hidden', !post.date);

            if (post.permalink) {
                els.permalink.href = post.permalink;
                els.permalink.classList.remove('hidden');
            } else {
                els.permalink.classList.add('hidden');
            }
            els.sourceLinks.replaceChildren();
            const sources = post.sources.filter(s => /^https?:/.test(s.permalink || ''));
            if (sources.length > 1) {
                for (const source of sources) {
                    const link = document.createElement('a');
                    const platform = source.platform === 'instagram' ? 'Instagram' : 'Facebook';
                    const samePlatform = sources.filter(s => s.platform === source.platform).length > 1;
                    link.textContent = samePlatform ? `${platform} · ${source.author}` : platform;
                    link.href = source.permalink;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'underline underline-offset-2 hover:text-stone-200';
                    els.sourceLinks.appendChild(link);
                }
                els.permalink.classList.add('hidden');
            }
        }

        function render() {
            const post = state.posts[state.i];
            if (!post) return;

            renderPhoto();
            applyPostMeta(post);

            els.counter.textContent = `${state.i + 1} / ${state.posts.length}`;

            // The on-screen arrows (phones) dim at the ends, like the key
            // handling does: there is nothing to go back/forward to.
            if (els.prev) els.prev.disabled = state.i <= 0;
            if (els.next) els.next.disabled = state.i >= state.posts.length - 1;

            const last = state.i === state.posts.length - 1;
            els.hint.innerHTML = last
                ? 'Ultimo ricordo · <kbd>←</kbd> per tornare indietro'
                : 'Premi <kbd>→</kbd> per il ricordo successivo · <kbd>←</kbd> per il precedente';

            preload(state.posts[state.i + 1]);
        }

        function go(index) {
            const next = Math.max(0, Math.min(index, state.posts.length - 1));
            if (next === state.i) return;
            state.i = next;
            state.photoIndex = 0;
            render();
            syncHash();
        }

        const nextPost = () => go(state.i + 1);
        const prevPost = () => go(state.i - 1);

        // On-screen arrows for touch screens (the keyboard hints stay on desktop).
        if (els.prev) els.prev.addEventListener('click', prevPost);
        if (els.next) els.next.addEventListener('click', nextPost);

        /* =====================================================================
           Deep links — every slide has its own address: #<post id>.
           Send that URL and the recipient lands on that exact memory.
           The address bar follows the slideshow via replaceState, so the back
           button still leaves the site instead of walking back through posts.
           ===================================================================== */
        const hashId = () => {
            const raw = (location.hash || '').replace(/^#/, '').trim();
            try { return decodeURIComponent(raw); } catch { return raw; }
        };

        function syncHash() {
            const post = state.posts[state.i];
            if (!post || !post.id) return;
            const want = '#' + post.id;
            if (location.hash !== want) history.replaceState(null, '', want);
        }

        /** The slide index the URL points at, or -1. */
        function indexFromHash() {
            const id = hashId();
            if (!id) return -1;
            return state.posts.findIndex(p => p.id === id || p.aliases.includes(id));
        }

        /** Follow a hash change. False when the id is unknown. */
        function goToHash() {
            const index = indexFromHash();
            if (index < 0) return false;
            if (index !== state.i) {
                state.i = index;
                state.photoIndex = 0;
                render();
            }
            syncHash();
            return true;
        }

        // An id that no longer exists (or a typo) must not leave the address bar
        // pointing at a slide that isn't on screen.
        window.addEventListener('hashchange', () => { if (!goToHash()) syncHash(); });

        let toastTimer = null;
        function toast(message) {
            const bubble = els.toast.firstElementChild;
            if (!bubble) return;
            bubble.textContent = message;
            els.toast.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.add('opacity-0'), 1900);
        }

        async function copyCurrentLink() {
            const url = location.href;
            try {
                await navigator.clipboard.writeText(url);
                toast('Link copiato');
                return;
            } catch { /* fall through: older browser or blocked permission */ }

            const area = document.createElement('textarea');
            area.value = url;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            area.remove();
            toast(ok ? 'Link copiato' : 'Copia il link dalla barra degli indirizzi');
        }

        if (els.share) {
            els.share.addEventListener('click', (event) => {
                event.preventDefault();
                copyCurrentLink();
            });
        }

        /* =====================================================================
           Search — fuzzy, over the post text (including a share's quoted text)
           and the author. Hits appear in a small window under the input; one
           click (or Enter) jumps to that slide.
           ===================================================================== */
        const SEARCH_MAX = 12;
        let searchIndex = null;
        let searchTokens = [];
        let activeResult = -1;

        const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        /* Lowercase, NFKC (Facebook prints 𝗔𝗻𝗻𝗶𝗯𝗮𝗹𝗲 in unicode bold) and
           strip accents, so "perche" finds "perché" and "cosi" finds "così". */
        function norm(s) {
            return (s || '').normalize('NFKC').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        /* A substring match beats a scattered subsequence; earlier is better;
           a longer word is worth more than a short one. -1 means "no match". */
        function tokenScore(hay, tok) {
            if (!hay) return -1;
            const at = hay.indexOf(tok);
            if (at >= 0) return 100 - Math.min(at, 40) * 0.5 + Math.min(tok.length, 12) * 2;

            // Scattered letters are only a match if they are reasonably close
            // together: "bllnt" can find "Bollenti", "zzzqqq" must not.
            let pos = 0, gaps = 0, first = -1, last = -1;
            for (const ch of tok) {
                const p = hay.indexOf(ch, pos);
                if (p < 0) return -1;
                if (first < 0) first = p;
                gaps += p - pos;
                pos = p + 1;
                last = p;
            }
            const span = last - first + 1;
            if (gaps > tok.length * 2 + 6 || span > tok.length * 4 + 10) return -1;
            return Math.max(1, 45 - Math.min(gaps, 20) * 1.5 - Math.min(first, 40) * 0.3);
        }

        function buildIndex() {
            searchIndex = state.posts.map((post, i) => ({
                i,
                text: norm(post.text),
                author: norm(post.author + ' ' + post.sourceAuthors),
                raw: post.text || '',
                rawAuthor: post.author || '',
                date: post.date || '',
                image: post.image || '',
            }));
        }

        function searchPosts(query) {
            if (!searchIndex || searchIndex.length !== state.posts.length) buildIndex();
            searchTokens = norm(query).split(/\s+/).filter(Boolean);
            if (!searchTokens.length) return [];

            const hits = [];
            for (const rec of searchIndex) {
                let score = 0, inAuthor = 0, ok = true;
                for (const tok of searchTokens) {
                    const st = tokenScore(rec.text, tok);
                    const sa = tokenScore(rec.author, tok);
                    const best = Math.max(st, sa);
                    if (best < 0) { ok = false; break; }
                    score += best;
                    if (sa >= 0 && sa >= st) inAuthor++;
                }
                if (!ok) continue;
                if (inAuthor === searchTokens.length) score += 25;  // the author matched every word
                hits.push({ rec, score });
            }
            return hits.sort((a, b) => b.score - a.score || a.rec.i - b.rec.i);
        }

        /* Same normalisation as `norm`, but keeping a map from each normalised
           character back to its offset in the original string. That is what
           lets a hit on "così" be found by the query "cosi" and still be
           highlighted in the original text. */
        function normMap(s) {
            let out = '';
            const map = [];
            let i = 0;
            for (const ch of s) {
                const n = ch.normalize('NFKC').toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                for (let k = 0; k < n.length; k++) { out += n[k]; map.push(i); }
                i += ch.length;
            }
            return { out, map };
        }

        /* A window around the first hit, so a result shows *why* it matched
           instead of always the opening line of the post. */
        function snippetFor(raw) {
            const SPAN = 170, PAD = 55;
            const { out, map } = normMap(raw);

            let hit = -1;
            for (const tok of searchTokens) {
                const p = out.indexOf(tok);
                if (p >= 0 && (hit < 0 || p < hit)) hit = p;
            }
            if (hit < 0) {
                return raw.slice(0, SPAN).replace(/\s+/g, ' ').trim() + (raw.length > SPAN ? '…' : '');
            }

            const start = Math.max(0, map[hit] - PAD);
            const end = Math.min(raw.length, start + SPAN);
            return (start > 0 ? '… ' : '')
                + raw.slice(start, end).replace(/\s+/g, ' ').trim()
                + (end < raw.length ? ' …' : '');
        }

        /* Wrap every occurrence of every word in <mark>, accent-insensitively. */
        function highlighted(raw) {
            const { out, map } = normMap(raw);
            const ranges = [];
            for (const tok of searchTokens) {
                let from = 0, p;
                while ((p = out.indexOf(tok, from)) >= 0) {
                    const a = map[p];
                    const b = p + tok.length < map.length
                        ? Math.max(map[p + tok.length], map[p + tok.length - 1] + 1)
                        : raw.length;
                    if (b > a) ranges.push([a, b]);
                    from = p + tok.length;
                    if (ranges.length > 40) break;
                }
            }
            if (!ranges.length) return esc(raw);

            ranges.sort((a, b) => a[0] - b[0]);
            let html = '', last = 0;
            for (const [a, b] of ranges) {
                if (b <= last) continue;
                const from = Math.max(a, last);
                html += esc(raw.slice(last, from)) + '<mark>' + esc(raw.slice(from, b)) + '</mark>';
                last = b;
            }
            return html + esc(raw.slice(last));
        }

        function paintResults(hits, query) {
            const box = els.results;
            if (!query) {
                box.classList.add('hidden');
                box.innerHTML = '';
                activeResult = -1;
                return;
            }

            if (!hits.length) {
                box.innerHTML = `<div class="px-4 py-3 text-sm text-stone-500">Nessun ricordo per «${esc(query)}»</div>`;
                box.classList.remove('hidden');
                activeResult = -1;
                return;
            }

            box.innerHTML = hits.slice(0, SEARCH_MAX).map(({ rec }) => {
                const thumb = rec.image
                    ? `<img src="${esc(rec.image)}" alt="" loading="lazy"
                            class="h-11 w-11 rounded-md object-cover shrink-0 bg-stone-900">`
                    : `<span class="h-11 w-11 rounded-md shrink-0 bg-white/5 border border-white/10"></span>`;
                return `
                    <button type="button" role="option" data-i="${rec.i}" aria-selected="false"
                            class="w-full text-left px-3 py-2.5 flex gap-3 items-start border-b border-white/5 last:border-0
                                   hover:bg-white/5 focus:outline-none transition-colors">
                        ${thumb}
                        <span class="min-w-0 flex-1">
                            <span class="flex items-baseline gap-2">
                                <span class="text-stone-100 text-sm font-medium truncate">${esc(rec.rawAuthor)}</span>
                                ${rec.date ? `<span class="text-[0.6rem] text-stone-500 uppercase tracking-wider truncate max-w-[45%]">${esc(rec.date)}</span>` : ''}
                            </span>
                            <span class="mt-1 block text-[0.78rem] leading-snug text-stone-400">${highlighted(snippetFor(rec.raw))}</span>
                        </span>
                    </button>`;
            }).join('') + (hits.length > SEARCH_MAX
                ? `<div class="px-4 py-2 text-[0.7rem] text-stone-500">altri ${hits.length - SEARCH_MAX} ricordi</div>`
                : '');

            box.classList.remove('hidden');
            activeResult = 0;
            paintActive();
        }

        const resultButtons = () => Array.from(els.results.querySelectorAll('button[data-i]'));

        function paintActive() {
            resultButtons().forEach((b, n) => {
                const on = n === activeResult;
                b.setAttribute('aria-selected', on ? 'true' : 'false');
                if (on) b.scrollIntoView({ block: 'nearest' });
            });
        }

        function closeResults() {
            els.results.classList.add('hidden');
            els.results.innerHTML = '';
            activeResult = -1;
        }

        function jumpTo(index) {
            closeResults();
            els.search.blur();
            go(index);
        }

        function onSearchInput() {
            const q = els.search.value.trim();
            paintResults(q ? searchPosts(q) : [], q);
        }

        els.search.addEventListener('input', onSearchInput);

        // Coming back to the box re-opens the last search instead of looking dead.
        els.search.addEventListener('focus', () => {
            if (els.search.value.trim()) onSearchInput();
        });

        els.search.addEventListener('keydown', (event) => {
            const btns = resultButtons();
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                if (!btns.length) return;
                event.preventDefault();
                const dir = event.key === 'ArrowDown' ? 1 : -1;
                activeResult = (activeResult + dir + btns.length) % btns.length;
                paintActive();
            } else if (event.key === 'Enter') {
                event.preventDefault();
                const target = btns[activeResult >= 0 ? activeResult : 0];
                if (target) jumpTo(Number(target.dataset.i));
            } else if (event.key === 'Escape') {
                event.preventDefault();
                if (els.search.value) {
                    els.search.value = '';
                    onSearchInput();
                } else {
                    closeResults();
                    els.search.blur();
                }
            }
        });

        els.results.addEventListener('click', (event) => {
            const btn = event.target.closest('button[data-i]');
            if (btn) jumpTo(Number(btn.dataset.i));
        });

        els.results.addEventListener('mousemove', (event) => {
            const btn = event.target.closest('button[data-i]');
            if (!btn) return;
            const n = resultButtons().indexOf(btn);
            if (n >= 0 && n !== activeResult) {
                activeResult = n;
                paintActive();
            }
        });

        document.addEventListener('click', (event) => {
            if (!els.searchWrap.contains(event.target)) closeResults();
        });

        // ⌘K / Ctrl-K opens the search from anywhere.
        document.addEventListener('keydown', (event) => {
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                els.search.focus();
                els.search.select();
            }
        });

        document.addEventListener('keydown', (event) => {
            const k = event.key;
            // Native player shortcuts belong to the player, including seeking.
            if (event.target?.closest?.('video, audio')) return;

            // Everything typed in the search box belongs to the search box.
            if (event.target && event.target.closest && event.target.closest('#search-wrap')) return;

            // Let Enter/Space activate a focused link (author, original post)
            // instead of silently advancing.
            const interactive = event.target && event.target.closest
                && event.target.closest('a, button, input, textarea, select');
            if (interactive && (k === 'Enter' || k === ' ')) return;

            if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'Enter') {
                event.preventDefault();
                nextPost();
            } else if (k === 'ArrowLeft' || k === 'ArrowUp') {
                event.preventDefault();
                prevPost();
            } else if (k === 'Home') {
                event.preventDefault();
                go(0);
            } else if (k === 'End') {
                event.preventDefault();
                go(state.posts.length - 1);
            }
        });

        function showMessage(html) {
            els.text.textContent = '';
            els.card.innerHTML =
                `<div class="my-auto text-stone-400 text-sm leading-relaxed">${html}</div>`;
        }

        async function init() {
            try {
                state.posts = normalise(await loadPosts());
                if (!state.posts.length) {
                    showMessage('Nessun ricordo da mostrare.');
                    return;
                }
                // A link like .../#fb_123 opens straight on that memory.
                // render() always runs: when the link points at the first slide,
                // state.i is already 0 and goToHash() alone would paint nothing.
                const fromHash = indexFromHash();
                state.i = fromHash >= 0 ? fromHash : 0;
                render();
                syncHash();
            } catch (err) {
                // file:// blocks fetch(); say so instead of showing a blank page.
                showMessage(`
                    <strong class="block mb-2 text-stone-100">Impossibile caricare ${DATA_URL}</strong>
                    ${err.message}<br><br>
                    Apri questa pagina da un server locale, non con doppio clic:
                    <code class="block mt-2 p-3 bg-white/5 rounded select-all">python3 -m http.server 8899</code>
                    poi vai su <code>http://localhost:8899/</code>.
                `);
            }
        }

        init();
    </script>
</body>
</html>

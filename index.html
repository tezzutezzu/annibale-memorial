<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>In Loving Memory — Annibale D'Elia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            800: '#292524',
                            900: '#1c1917',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html, body { height: 100%; }

        /* One post at a time: the page itself never scrolls. */
        body {
            background-color: #0b0a09;
            background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
            background-size: 32px 32px;
            overflow: hidden;
            color: #e7e5e4;
        }

        /* --- backdrop ------------------------------------------------------
           A slow, many-coloured nebula with drifting dust, painted in WebGL on
           one canvas that sits behind the page. Pure decoration: it takes no
           pointer events and carries no content (aria-hidden in the markup). */
        #aura {
            position: fixed;
            inset: 0;
            z-index: 0;
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .page { position: relative; z-index: 1; }

        /* The colour gathers under the words, so the type gets a whisper of
           shadow to keep its edges crisp against it. */
        #text { text-shadow: 0 1px 18px rgba(0, 0, 0, 0.5); }

        /* --- Image (left) ------------------------------------------------- */
        #figure {
            position: relative;
            overflow: hidden;
        }

        .photo {
            position: absolute;
            inset: 0;
            margin: auto;
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 1rem;
            /* Photos arrive with their own pale frame, so a heavy black drop
               shadow read as a grubby smudge on the coloured ground. A hairline
               and two soft, mostly downward shadows lift the picture without
               darkening the space around it. */
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.55),
                0 1px 3px rgba(0, 0, 0, 0.35),
                0 18px 40px -22px rgba(0, 0, 0, 0.55);
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        /* Long posts scroll inside their column, never the page. */
        .quote {
            scrollbar-width: thin;
            scrollbar-color: #44403c transparent;
        }
        .quote::-webkit-scrollbar { width: 6px; }
        .quote::-webkit-scrollbar-thumb { background: #44403c; border-radius: 9999px; }

        /* When a post has no picture the image column collapses to zero
           width, so the text takes the whole width. */
        @media (max-width: 767px) {
            .no-image #figure { display: none; }
        }
        @media (min-width: 768px) {
            .no-image { grid-template-columns: 0px 1fr !important; }
            .no-image #card { max-width: 46rem; margin-inline: auto; width: 100%; }
        }

        /* --- search ------------------------------------------------------- */
        /* Under the input on wide screens; on a phone the input is full width,
           so the panel simply matches it. */
        #results {
            position: absolute;
            right: 0;
            top: calc(100% + 0.5rem);
            width: min(26rem, 86vw);
            overflow-x: hidden;      /* long alt-text "dates" must not widen the panel */
            /* Solid, not translucent: the post behind the panel is long text,
               and anything see-through made the results unreadable. */
            background-color: #14120f;
        }
        @media (max-width: 767px) {
            #results {
                left: 0;
                right: 0;
                width: auto;
            }
        }

        /* The searched words, marked inside the result snippets. */
        #results mark {
            background: rgba(253, 230, 138, 0.16);
            color: #fde68a;
            border-radius: 0.15rem;
            padding: 0 0.1rem;
        }
        #results::-webkit-scrollbar { width: 6px; }
        #results::-webkit-scrollbar-thumb { background: #44403c; border-radius: 9999px; }
        #results { scrollbar-width: thin; scrollbar-color: #44403c transparent; }
        #results [aria-selected="true"] { background: rgba(255, 255, 255, 0.07); }
        /* Chrome's own clear button on <input type=search> is invisible on dark. */
        #search::-webkit-search-cancel-button { filter: invert(0.6); cursor: pointer; }
    </style>
</head>
<body class="text-stone-200 antialiased">

    <canvas id="aura" aria-hidden="true"></canvas>

    <div class="page h-full flex flex-col">

        <!-- Header: on wide screens title left, section selector centred, search
             and counter right. Narrower screens stack: title/counter, selector,
             then the full-width search. -->
        <header class="shrink-0 w-full max-w-[1600px] mx-auto px-4 md:px-10 pt-5 md:pt-8 pb-2
                       grid grid-cols-[auto_1fr] lg:grid-cols-[1fr_auto_1fr] items-center
                       gap-x-4 gap-y-2">
            <p class="col-start-1 row-start-1 text-stone-500 uppercase tracking-[0.2em] text-[0.7rem] md:text-xs">
                PER ANNIBALE
            </p>

            <nav aria-label="Sezioni del sito"

                        lg:col-span-1 lg:col-start-2 lg:row-start-1">
                <a href="index.html" aria-current="page"
                   class="rounded-full border border-white/15 bg-white/10 px-2.5 py-1 text-stone-100">Ricordi</a>

                   class="rounded-full border border-transparent px-2.5 py-1 text-stone-500 transition-colors
                          hover:bg-white/5 hover:text-stone-200">Video</a>
            </nav>

            <!-- `contents` lets the counter join the narrow grid, while on a wide
                 screen the two sit together in the right-hand column. -->
            <div class="contents lg:col-start-3 lg:row-start-1 lg:flex lg:items-center lg:justify-self-end lg:gap-4">
                <!-- Fuzzy search over the posts -->
                <div id="search-wrap" class="relative col-span-2 row-start-3 w-full lg:w-auto shrink-0">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-stone-500 pointer-events-none"
                         xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
                    </svg>
                    <input id="search" type="search" autocomplete="off" spellcheck="false"
                           placeholder="Cerca un ricordo…"

            </div>
        </header>

        <!-- Post -->
        <main class="flex-1 min-h-0 w-full max-w-[1600px] mx-auto px-4 md:px-10 pb-2">
            <div id="grid" class="h-full grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12 items-stretch">

                <!-- Image, left -->
                <figure id="figure" class="relative h-full min-h-[38vh] md:min-h-0">
                    <img id="photo" class="photo" alt="">
                </figure>

                <!-- Text, right -->
                <article id="card" class="h-full min-h-0 flex flex-col">
                    <blockquote id="text"
                        class="quote font-serif text-lg md:text-2xl leading-relaxed md:leading-relaxed text-stone-200 whitespace-pre-line my-auto overflow-y-auto pr-2"></blockquote>

                    <div class="mt-6 md:mt-8 pt-4 border-t border-white/10 flex items-center justify-between gap-4">
                        <div class="min-w-0">
                            <a id="author-link" href="#" target="_blank" rel="noopener noreferrer"

                                <span id="author"></span>
                            </a>
                            <span id="date" class="block text-[0.7rem] text-stone-500 mt-1 uppercase tracking-wider"></span>

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M13.828 10.172a4 4 0 015.656 0l1.415 1.414a4 4 0 01-5.657 5.657l-1.414-1.414M10.172 13.828a4 4 0 01-5.657 0l-1.414-1.414a4 4 0 015.657-5.657l1.414 1.414M9 15l6-6" />
                                </svg>
                            </button>
                            <a id="permalink" href="#" target="_blank" rel="noopener noreferrer"
                               class="text-stone-600 hover:text-stone-300 transition-colors"
                               title="Apri il post originale">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                </svg>

                    </div>
                </article>
            </div>
        </main>

        <!-- Footer: the two arrows, side by side and centred. -->
        <footer class="shrink-0 w-full py-2 md:py-4 px-4 md:px-6">
            <div class="mx-auto flex w-full max-w-[1600px] items-center justify-center gap-4">
                <button id="prev" type="button" aria-label="Ricordo precedente"

                               rounded-full border border-white/10 bg-white/5 text-stone-300 transition-colors

                               hover:border-white/25 hover:bg-white/10 hover:text-stone-100
                               active:bg-white/20 disabled:cursor-default disabled:opacity-25 disabled:hover:border-white/10 disabled:hover:bg-white/5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-5 md:w-5" fill="none" viewBox="0 0 24 24"

    </div>

    <!-- Confirmation for "copy link" -->
    <div id="toast" aria-live="polite"
         class="pointer-events-none fixed inset-x-0 bottom-16 z-[60] flex justify-center
                opacity-0 transition-opacity duration-200">
        <span class="rounded-full border border-white/10 bg-white/10 px-3 py-1.5 text-xs
                     text-stone-200 shadow-lg shadow-black/40 backdrop-blur"></span>
    </div>

    <script>
    /* ---------------------------------------------------------------------
       Backdrop: a multicolour nebula swirling under the words, with motes of
       coloured dust drifting up through it. One canvas, two WebGL passes.
       Everything here is optional — if WebGL is missing the canvas is removed
       and the page keeps its plain dark background.
       --------------------------------------------------------------------- */
    (function backdrop() {
        const canvas = document.getElementById('aura');
        if (!canvas) return;

        const gl = canvas.getContext('webgl', {
            alpha: true,
            antialias: false,
            depth: false,
            stencil: false,
            premultipliedAlpha: true,
            powerPreference: 'low-power',
        });
        if (!gl) { canvas.remove(); return; }

        const NEBULA_VS = `
            attribute vec2 aPos;
            varying vec2 vUv;
            void main() {
                vUv = aPos * 0.5 + 0.5;
                gl_Position = vec4(aPos, 0.0, 1.0);
            }
        `;

        const NEBULA_FS = `
            #ifdef GL_FRAGMENT_PRECISION_HIGH
            precision highp float;
            #else
            precision mediump float;
            #endif

            varying vec2 vUv;
            uniform vec2  uRes;
            uniform float uTime;
            uniform vec2  uFocus;      // centre of the words, in 0..1 screen space
            uniform vec2  uFocusSize;  // their half-extents, same space
            uniform sampler2D uNoise;  // seamless noise, one field per channel

            mat2 rot(float a) {
                float c = cos(a);
                float s = sin(a);
                return mat2(c, -s, s, c);
            }

            /* The noise is a baked texture, not a hash computed here. A hash
               has to multiply the lattice coordinate by a few hundred, and a
               phone's fragment shader can be limited to 16-bit floats, which
               only hold whole numbers exactly up to 2048: past that the
               product loses its fraction, every cell returns the same value
               and the whole field goes flat in hard-edged rectangles. Texture
               lookups are immune to this. Four independent seamless fields are
               packed into the four channels. */
            vec4 field(vec2 uv) {
                return texture2D(uNoise, fract(uv));
            }

            vec3 palette(float t) {
                t = fract(t) * 4.0;
                vec3 indigo  = vec3(0.32, 0.26, 0.95);
                vec3 cyan    = vec3(0.20, 0.78, 1.00);
                vec3 magenta = vec3(0.95, 0.32, 0.90);
                vec3 gold    = vec3(1.00, 0.68, 0.32);
                if (t < 1.0) return mix(indigo,  cyan,    smoothstep(0.0, 1.0, t));
                if (t < 2.0) return mix(cyan,    magenta, smoothstep(0.0, 1.0, t - 1.0));
                if (t < 3.0) return mix(magenta, gold,    smoothstep(0.0, 1.0, t - 2.0));
                return mix(gold, indigo, smoothstep(0.0, 1.0, t - 3.0));
            }

            void main() {
                float aspect = uRes.x / uRes.y;
                // Isotropic coordinates, so the nebula is never stretched on a
                // phone held upright.
                vec2 aspectVec = vec2(max(aspect, 1.0), max(1.0 / aspect, 1.0));
                vec2 p = (vUv - 0.5) * aspectVec;

                /* Nothing below may grow with time, and the texture handles
                   are wrapped: a slow swirl plus a small sway keeps every
                   number in the range a phone can represent. */
                float t = uTime;
                vec2 q = rot(0.011 * t) * p;
                vec2 sway = 0.06 * vec2(sin(t * 0.045), cos(t * 0.037));

                // Each channel is an independent field, so the layers do not
                // move together. Wrapping by hand keeps the lookups in 0..1.
                vec2 warp = field(q * 0.34 + sway).rg - 0.5;
                float veil = field(q * 0.52 + vec2(0.31, 0.63)).b;

                // How large the folds are: lower numbers give broader ridges.
                float fold = 0.55;
                float curtain = field(vec2(q.x * fold, q.y * 0.16) + sway.yx).a;
                float thread  = field(q * 0.62 + vec2(0.13, 0.77) + warp * 0.18 + sway).r;

                // Ridged noise: the folds that read as ribbons of light. Keeping
                // the exponents low leaves them broad instead of hairline-thin.
                float fall  = pow(clamp(1.0 - abs(2.0 * curtain - 1.0), 0.0, 1.0), 2.6);
                float wisp  = pow(clamp(1.0 - abs(2.0 * thread - 1.0), 0.0, 1.0), 2.0);

                // Hue runs across the page and drifts with the noise, so
                // neighbouring folds are different colours.
                float hue = 0.55 + 0.24 * warp.y + 0.34 * p.x + 0.22 * p.y
                          + 0.16 * veil + 0.05 * sin(t * 0.021);
                vec3 col = mix(palette(hue), palette(hue + 0.26), wisp * 0.6);
                col = mix(col, vec3(1.0), 0.04);

                // The colour gathers under the words, with a fainter echo of it
                // across the rest of the page.
                vec2 d = (vUv - uFocus) * aspectVec;
                vec2 r = max(uFocusSize * aspectVec, vec2(1e-3));
                float dist = length(d / r);
                float under = exp(-dist * dist * 0.5);

                // Light lives in the folds; between them the page stays dark,
                // which is what keeps the type readable. A soft hollow in the
                // middle of the block reads as a halo around the words and
                // keeps the busiest part of the sky off the glyphs.
                float glow = min(fall + 0.5 * wisp, 1.0);
                float halo = 1.0 - 0.30 * exp(-dist * dist * 2.2);
                float alpha = (0.14 + 0.86 * under) * halo * (0.012 + 0.62 * glow);

                gl_FragColor = vec4(col, alpha);
            }
        `;

        const MOTE_VS = `
            attribute vec2 aSeed;    // where it starts, 0..1
            attribute vec2 aMotion;  // x: drift speed, y: size in css px
            attribute float aPhase;

            uniform float uTime;
            uniform vec2  uRes;
            uniform vec2  uPointer;
            uniform float uPixelRatio;

            varying float vTwinkle;
            varying float vHue;

            // Everything repeats exactly every CYCLE seconds: the drift speed
            // is a whole number of screens per cycle and the sway and twinkle
            // run a whole number of turns. So the clock can be wrapped without
            // a jump, and it never reaches a magnitude the GPU cannot hold.
            const float CYCLE = 600.0;
            const float TURN = 6.2831853 / CYCLE;

            void main() {
                float knots = aMotion.x;              // 3..13 screens per cycle
                float tt = mod(uTime, CYCLE);

                // Drift up and wrap; a slow sway keeps the column from looking
                // like it is on rails.
                float y = fract(aSeed.y + knots * tt / CYCLE);
                float sway = TURN * (20.0 + knots * 2.0) * tt + aPhase * 6.2831853;
                float x = fract(aSeed.x + 0.035 * sin(sway));

                vec2 pos = vec2(x * 2.0 - 1.0, y * 2.0 - 1.0);
                pos.x *= uRes.x / uRes.y;
                pos += uPointer * (0.008 + 0.02 * aSeed.x);

                gl_Position = vec4(pos, 0.0, 1.0);

                float beat = TURN * (30.0 + knots * 3.0) * tt + aPhase * 6.2831853;
                vTwinkle = 0.30 + 0.70 * (0.5 + 0.5 * sin(beat));
                vHue = fract(aPhase * 1.7 + aSeed.x * 0.6 + 0.04 * sin(beat * 0.5));
                gl_PointSize = aMotion.y * uPixelRatio * (0.55 + 0.9 * vTwinkle);
            }
        `;

        const MOTE_FS = `
            precision mediump float;

            varying float vTwinkle;
            varying float vHue;

            void main() {
                float d = length(gl_PointCoord - 0.5);
                float core = smoothstep(0.5, 0.0, d);
                core *= core;

                vec3 col = 0.5 + 0.5 * cos(6.28318 * (vHue + vec3(0.0, 0.33, 0.67)));
                col = mix(vec3(1.0), col, 0.45);

                gl_FragColor = vec4(col, core * vTwinkle * 0.42);
            }
        `;

        function compile(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                throw new Error(gl.getShaderInfoLog(shader) || 'shader compile failed');
            }
            return shader;
        }

        function link(vsSource, fsSource) {
            const program = gl.createProgram();
            gl.attachShader(program, compile(gl.VERTEX_SHADER, vsSource));
            gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fsSource));
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                throw new Error(gl.getProgramInfoLog(program) || 'program link failed');
            }
            return program;
        }

        let nebula;
        let mote;
        try {
            nebula = link(NEBULA_VS, NEBULA_FS);
            mote = link(MOTE_VS, MOTE_FS);
        } catch (err) {
            console.warn('Aura disabled:', err.message);
            canvas.remove();
            return;
        }

        /* One tile of seamless noise per channel, three octaves deep, built
           once in JS. Sampling it costs less than the hash maths it replaces
           and cannot fall apart on a phone. */
        function makeNoiseTexture(size) {
            const data = new Uint8Array(size * size * 4);
            const OCTAVES = [[3, 1], [7, 0.55], [15, 0.3]];

            // A fixed seed: the sky is the same on every visit, so the page
            // does not look different each time it is opened.
            let seed = 0x9e3779b9;
            const random = () => {
                seed = (seed + 0x6d2b79f5) | 0;
                let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };

            const smooth = (f) => f * f * f * (f * (f * 6 - 15) + 10);

            for (let channel = 0; channel < 4; channel++) {
                // A random lattice per octave; sampling wraps, so the tile
                // joins itself without a seam.
                const lattices = OCTAVES.map(([cells]) => {
                    const grid = new Float32Array(cells * cells);
                    for (let i = 0; i < grid.length; i++) grid[i] = random() - 0.5;
                    return grid;
                });

                const at = (grid, cells, x, y) =>
                    grid[((y % cells + cells) % cells) * cells + ((x % cells + cells) % cells)];

                // Two passes: sample, then stretch what came out across the
                // whole 0..1 range. A sum of octaves clusters near the middle,
                // and ridged noise needs the extremes to actually form ridges.
                const raw = new Float32Array(size * size);
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        let v = 0;
                        let total = 0;
                        for (let o = 0; o < OCTAVES.length; o++) {
                            const cells = OCTAVES[o][0];
                            const amp = OCTAVES[o][1];
                            const fx = (x / size) * cells;
                            const fy = (y / size) * cells;
                            const ix = Math.floor(fx);
                            const iy = Math.floor(fy);
                            // Smoothstep between lattice points: soft folds
                            // instead of a visible grid.
                            const ux = smooth(fx - ix);
                            const uy = smooth(fy - iy);
                            const grid = lattices[o];
                            const top = at(grid, cells, ix, iy)
                                + (at(grid, cells, ix + 1, iy) - at(grid, cells, ix, iy)) * ux;
                            const bottom = at(grid, cells, ix, iy + 1)
                                + (at(grid, cells, ix + 1, iy + 1) - at(grid, cells, ix, iy + 1)) * ux;
                            v += amp * (top + (bottom - top) * uy);
                            total += amp;
                        }
                        raw[y * size + x] = v / total;
                    }
                }

                let lo = Infinity;
                let hi = -Infinity;
                for (let i = 0; i < raw.length; i++) {
                    if (raw[i] < lo) lo = raw[i];
                    if (raw[i] > hi) hi = raw[i];
                }
                const span = hi - lo || 1;
                for (let i = 0; i < raw.length; i++) {

                }
            }

            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

        let noiseTex = null;

        const nebulaAt = {
            aPos: gl.getAttribLocation(nebula, 'aPos'),
            uRes: gl.getUniformLocation(nebula, 'uRes'),
            uTime: gl.getUniformLocation(nebula, 'uTime'),
            uFocus: gl.getUniformLocation(nebula, 'uFocus'),
            uFocusSize: gl.getUniformLocation(nebula, 'uFocusSize'),
            uNoise: gl.getUniformLocation(nebula, 'uNoise'),
        };

            aSeed: gl.getAttribLocation(mote, 'aSeed'),
            aMotion: gl.getAttribLocation(mote, 'aMotion'),
            aPhase: gl.getAttribLocation(mote, 'aPhase'),
            uTime: gl.getUniformLocation(mote, 'uTime'),
            uRes: gl.getUniformLocation(mote, 'uRes'),
            uPointer: gl.getUniformLocation(mote, 'uPointer'),
            uPixelRatio: gl.getUniformLocation(mote, 'uPixelRatio'),
        };

        const quad = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quad);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        const COUNT = window.innerWidth < 768 ? 180 : 360;
        const seeds = new Float32Array(COUNT * 2);
        const motions = new Float32Array(COUNT * 2);
        const phases = new Float32Array(COUNT);
        for (let i = 0; i < COUNT; i++) {
            const big = Math.random();
            seeds[i * 2] = Math.random();
            seeds[i * 2 + 1] = Math.random();
            // A whole number of screens per animation cycle (see CYCLE in
            // MOTE_VS), so wrapping the clock never teleports a mote.
            motions[i * 2] = 3 + Math.floor(Math.random() * 11);
            motions[i * 2 + 1] = 1.1 + Math.pow(big, 2.2) * 3.6;
            phases[i] = Math.random();
        }

        function buffer(data) {
            const b = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, b);
            gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
            return b;
        }

        const motionBuf = buffer(motions);
        const phaseBuf = buffer(phases);

        // The words to gather the colour around.
        const focus = { cx: 0.5, cy: 0.5, rx: 0.35, ry: 0.3 };
        const target = { ...focus };

        function measure() {
            const el = document.getElementById('text');
            if (!el) return;
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            target.cx = (r.left + r.width / 2) / window.innerWidth;
            target.cy = 1 - (r.top + r.height / 2) / window.innerHeight;
            target.rx = Math.max(r.width / 2 / window.innerWidth, 0.2);
            target.ry = Math.max(r.height / 2 / window.innerHeight, 0.22);
        }

        const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
        window.addEventListener('pointermove', (event) => {
            pointer.tx = (event.clientX / window.innerWidth) * 2 - 1;
            pointer.ty = 1 - (event.clientY / window.innerHeight) * 2;

        function resize() {
            // A soft nebula does not need device pixels: 1.25 is plenty and
            // keeps integrated GPUs cool.
            const scale = Math.min(window.devicePixelRatio || 1, 1.25);
            const w = Math.max(1, Math.round(canvas.clientWidth * scale));
            const h = Math.max(1, Math.round(canvas.clientHeight * scale));
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
            gl.viewport(0, 0, w, h);

        function draw(time) {
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.enable(gl.BLEND);

            // Nebula: ordinary alpha over the dark page.
            gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
            gl.useProgram(nebula);
            gl.bindBuffer(gl.ARRAY_BUFFER, quad);
            gl.enableVertexAttribArray(nebulaAt.aPos);
            gl.vertexAttribPointer(nebulaAt.aPos, 2, gl.FLOAT, false, 0, 0);
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, noiseTex);
            gl.uniform1i(nebulaAt.uNoise, 0);
            gl.uniform2f(nebulaAt.uRes, canvas.width, canvas.height);
            gl.uniform1f(nebulaAt.uTime, time);
            gl.uniform2f(nebulaAt.uFocus, focus.cx, focus.cy);
            gl.uniform2f(nebulaAt.uFocusSize, focus.rx, focus.ry);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            // Motes: added light, so they glow through the nebula.
            gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE);
            gl.useProgram(mote);
            gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
            gl.enableVertexAttribArray(moteAt.aSeed);
            gl.vertexAttribPointer(moteAt.aSeed, 2, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ARRAY_BUFFER, motionBuf);
            gl.enableVertexAttribArray(moteAt.aMotion);
            gl.vertexAttribPointer(moteAt.aMotion, 2, gl.FLOAT, false, 0, 0);
            gl.bindBuffer(gl.ARRAY_BUFFER, phaseBuf);
            gl.enableVertexAttribArray(moteAt.aPhase);
            gl.vertexAttribPointer(moteAt.aPhase, 1, gl.FLOAT, false, 0, 0);

            gl.uniform1f(moteAt.uTime, time);
            gl.uniform2f(moteAt.uRes, canvas.width, canvas.height);
            gl.uniform2f(moteAt.uPointer, pointer.x, pointer.y);
            gl.uniform1f(moteAt.uPixelRatio, canvas.width / Math.max(1, canvas.clientWidth));
            gl.drawArrays(gl.POINTS, 0, COUNT);
        }

        let frame = 0;
        let lastPaint = 0;
        /* Animation time, counted only while the page is on screen. Reading it
           off the wall clock meant a phone put away for an hour came back to a
           clock an hour further on: the scene jumped, and the noise drifted
           past what a mobile GPU can hold. */
        let clock = 0;

        function settle() {
            // Ease the glow towards the words instead of snapping when a post
            // changes shape.
            focus.cx += (target.cx - focus.cx) * 0.09;
            focus.cy += (target.cy - focus.cy) * 0.09;
            focus.rx += (target.rx - focus.rx) * 0.09;
            focus.ry += (target.ry - focus.ry) * 0.09;
            pointer.x += (pointer.tx - pointer.x) * 0.05;
            pointer.y += (pointer.ty - pointer.y) * 0.05;
        }

        function tick(now) {
            frame = requestAnimationFrame(tick);
            // ~40fps is enough for something this slow, and kinder on battery.
            if (now - lastPaint < 24) return;
            // A long gap is a returning tab, not a long frame: do not let it
            // advance the scene.
            if (lastPaint) clock += Math.min(now - lastPaint, 100) / 1000;
            lastPaint = now;

            settle();
            draw(clock);
        }

        function run() {
            if (still.matches) {
                cancelAnimationFrame(frame);
                frame = 0;
                Object.assign(focus, target);
                draw(11.0);                  // one calm, static frame
                return;
            }
            // Restart the frame clock: time spent hidden must not be counted.
            lastPaint = 0;
            if (!frame) frame = requestAnimationFrame(tick);
        }

        window.addEventListener('resize', () => { resize(); if (still.matches) run(); });
        if (window.ResizeObserver) {
            new ResizeObserver(() => { measure(); if (still.matches) run(); })
                .observe(document.getElementById('text') || document.body);
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                cancelAnimationFrame(frame);
                frame = 0;
            } else {
                run();
            }
        });
        if (still.addEventListener) still.addEventListener('change', run);

        // If the driver drops the context the canvas goes blank; the page keeps
        // its own dark background, and nothing depends on the glow.
        canvas.addEventListener('webglcontextlost', (event) => {
            event.preventDefault();
            cancelAnimationFrame(frame);
            frame = 0;
            canvas.style.display = 'none';
        });

        // `?aura=off` turns the backdrop off for a single visit: handy for
        // checking a phone where the sky misbehaves.
        if (new URLSearchParams(location.search).get('aura') === 'off') {
            canvas.remove();
            return;
        }

        function boot() {
            noiseTex = makeNoiseTexture(256);
            resize();
            run();
        }

        // Preparing the noise takes a few dozen milliseconds; two frames of
        // delay put it after the words have painted, so the page never waits
        // on the decoration. In a hidden tab this simply waits until shown.
        requestAnimationFrame(() => requestAnimationFrame(boot));
    })();
    </script>

    <script>
        // Same store the gallery reads: one JSON object per line, written by
        // import_console_dump.py. A plain JSON array is accepted too.
        const DATA_URL = 'data/posts.jsonl';

        const els = {
            grid: document.getElementById('grid'),
            figure: document.getElementById('figure'),
            photo: document.getElementById('photo'),
            card: document.getElementById('card'),
            text: document.getElementById('text'),
            author: document.getElementById('author'),
            authorLink: document.getElementById('author-link'),
            date: document.getElementById('date'),
            permalink: document.getElementById('permalink'),
            counter: document.getElementById('counter'),
            prev: document.getElementById('prev'),
            next: document.getElementById('next'),
            search: document.getElementById('search'),
            searchWrap: document.getElementById('search-wrap'),
            results: document.getElementById('results'),
            share: document.getElementById('share'),
            toast: document.getElementById('toast'),
        };

        const state = { posts: [], i: 0 };

        function parsePosts(text) {
            const trimmed = text.trim();
            if (!trimmed) return [];
            if (trimmed.startsWith('[')) return JSON.parse(trimmed);                  // JSON array
            return trimmed.split('\n').filter(l => l.trim()).map(l => JSON.parse(l)); // JSONL
        }

        async function loadPosts() {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status} per ${DATA_URL}`);
            return parsePosts(await res.text());
        }

        /* ---------------------------------------------------------------- date --
           `time_text` is Facebook's own stamp ("3 h", "24 ottobre 2026"). The
           2026 build sometimes put the image description in that field instead
           ("May be an image of…"), and older scrapes also let video durations
           through. Neither is a date, so it is checked before being shown: a
           wrong date is worse than no date. */
        const TIME_LABEL_RE = /^(?:\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?|\d{4}-\d{2}-\d{2}|oggi|ieri|yesterday|just now|\d+\s*(?:s|m|min|h|d|g|gg|ore|ora|giorni?|settimane?|mesi|anni|minutes?|hours?|days?|weeks?|months?|years?)(?:\s+(?:ago|fa))?)$/i;
        const MONTH_RE = /\b(?:gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
        const NOT_A_DATE_RE = /^(?:may be|might be|could be|potrebbe essere|no photo description|nessuna descrizione)/i;

        function dateLabel(post) {
            const raw = (post.time_text || '').trim();
            if (!raw || raw.length > 40) return '';
            if (NOT_A_DATE_RE.test(raw)) return '';
            if (TIME_LABEL_RE.test(raw)) return raw;
            if (/\d/.test(raw) && MONTH_RE.test(raw)) return raw;   // "24 ottobre 2026"
            return '';
        }

        /** Pick the fields the view needs; drop rows with neither words nor picture. */
        function normalise(posts) {
            return posts
                // Relevance is a flag, not a deletion: flagged rows stay in the
                // data and come back by clearing `relevant`.
                .filter(post => post.relevant !== false)
                .map(post => {
                    const img = (post.media || []).find(m => m.type === 'image' && (m.local_path || m.url));
                    // A share often names Annibale only in the quoted post; without
                    // this the slide loses the only mention.
                    const own = (post.text || '').trim();
                    const shared = (post.shared_text || '').trim();
                    const quoted = shared
                        ? '\n\n↪ ' + (post.shared_author ? post.shared_author + ': ' : '') + shared
                        : '';
                    return {
                        id: post.id,          // the slide's address: .../#<id>
                        text: own + quoted,
                        author: post.author || 'Anonimo',
                        authorUrl: post.author_url && post.author_url !== '#' ? post.author_url : null,
                        permalink: post.permalink || null,
                        image: img ? (img.local_path || img.url) : null,
                        alt: (img && img.alt) || '',
                        // Only a real post date; empty means "show nothing".
                        // (collected_at is the day of the scrape, not the post.)
                        date: dateLabel(post),
                    };
                })
                .filter(p => p.text || p.image);
        }

        function preload(post) {
            if (post && post.image) new Image().src = post.image;
        }

        function applyPostMeta(post) {
            // textContent, so nothing written on Facebook is treated as markup.
            els.text.textContent = post.text;
            els.text.scrollTop = 0;

            els.author.textContent = post.author;
            if (post.authorUrl) {
                els.authorLink.href = post.authorUrl;
                els.authorLink.classList.remove('pointer-events-none');
            } else {
                els.authorLink.removeAttribute('href');
                els.authorLink.classList.add('pointer-events-none');
            }

            els.date.textContent = post.date || '';
            els.date.classList.toggle('hidden', !post.date);

            if (post.permalink) {
                els.permalink.href = post.permalink;
                els.permalink.classList.remove('hidden');
            } else {
                els.permalink.classList.add('hidden');
            }
        }

        function render() {
            const post = state.posts[state.i];
            if (!post) return;

            els.grid.classList.toggle('no-image', !post.image);

            if (post.image) {
                els.photo.src = post.image;
                els.photo.alt = post.alt || '';
            } else {
                els.photo.removeAttribute('src');
                els.photo.alt = '';
            }

            applyPostMeta(post);

            els.counter.textContent = `${state.i + 1} / ${state.posts.length}`;

            // The on-screen arrows (phones) dim at the ends, like the key
            // handling does: there is nothing to go back/forward to.
            if (els.prev) els.prev.disabled = state.i <= 0;
            if (els.next) els.next.disabled = state.i >= state.posts.length - 1;

            preload(state.posts[state.i + 1]);
        }

        function go(index) {
            const next = Math.max(0, Math.min(index, state.posts.length - 1));
            if (next === state.i) return;
            state.i = next;
            render();
            syncHash();
        }

        const nextPost = () => go(state.i + 1);
        const prevPost = () => go(state.i - 1);

        // On-screen arrows for touch screens (the keyboard hints stay on desktop).
        if (els.prev) els.prev.addEventListener('click', prevPost);
        if (els.next) els.next.addEventListener('click', nextPost);

        /* =====================================================================
           Deep links — every slide has its own address: #<post id>.
           Send that URL and the recipient lands on that exact memory.
           The address bar follows the slideshow via replaceState, so the back
           button still leaves the site instead of walking back through posts.
           ===================================================================== */
        const hashId = () => {
            const raw = (location.hash || '').replace(/^#/, '').trim();
            try { return decodeURIComponent(raw); } catch { return raw; }
        };

        function syncHash() {
            const post = state.posts[state.i];
            if (!post || !post.id) return;
            const want = '#' + post.id;
            if (location.hash !== want) history.replaceState(null, '', want);
        }

        /** The slide index the URL points at, or -1. */
        function indexFromHash() {
            const id = hashId();
            if (!id) return -1;
            return state.posts.findIndex(p => p.id === id);
        }

        /** Follow a hash change. False when the id is unknown. */
        function goToHash() {
            const index = indexFromHash();
            if (index < 0) return false;
            if (index !== state.i) {
                state.i = index;
                render();
            }
            return true;
        }

        // An id that no longer exists (or a typo) must not leave the address bar
        // pointing at a slide that isn't on screen.
        window.addEventListener('hashchange', () => { if (!goToHash()) syncHash(); });

        let toastTimer = null;
        function toast(message) {
            const bubble = els.toast.firstElementChild;
            if (!bubble) return;
            bubble.textContent = message;
            els.toast.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => els.toast.classList.add('opacity-0'), 1900);
        }

        async function copyCurrentLink() {
            const url = location.href;
            try {
                await navigator.clipboard.writeText(url);
                toast('Link copiato');
                return;
            } catch { /* fall through: older browser or blocked permission */ }

            const area = document.createElement('textarea');
            area.value = url;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            area.remove();
            toast(ok ? 'Link copiato' : 'Copia il link dalla barra degli indirizzi');
        }

        if (els.share) {
            els.share.addEventListener('click', (event) => {
                event.preventDefault();
                copyCurrentLink();
            });
        }

        /* =====================================================================
           Search — fuzzy, over the post text (including a share's quoted text)
           and the author. Hits appear in a small window under the input; one
           click (or Enter) jumps to that slide.
           ===================================================================== */
        const SEARCH_MAX = 12;
        let searchIndex = null;
        let searchTokens = [];
        let activeResult = -1;

        const esc = (s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        /* Lowercase, NFKC (Facebook prints 𝗔𝗻𝗻𝗶𝗯𝗮𝗹𝗲 in unicode bold) and
           strip accents, so "perche" finds "perché" and "cosi" finds "così". */
        function norm(s) {
            return (s || '').normalize('NFKC').toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        /* A substring match beats a scattered subsequence; earlier is better;
           a longer word is worth more than a short one. -1 means "no match". */
        function tokenScore(hay, tok) {
            if (!hay) return -1;
            const at = hay.indexOf(tok);
            if (at >= 0) return 100 - Math.min(at, 40) * 0.5 + Math.min(tok.length, 12) * 2;

            // Scattered letters are only a match if they are reasonably close
            // together: "bllnt" can find "Bollenti", "zzzqqq" must not.
            let pos = 0, gaps = 0, first = -1, last = -1;
            for (const ch of tok) {
                const p = hay.indexOf(ch, pos);
                if (p < 0) return -1;
                if (first < 0) first = p;
                gaps += p - pos;
                pos = p + 1;
                last = p;
            }
            const span = last - first + 1;
            if (gaps > tok.length * 2 + 6 || span > tok.length * 4 + 10) return -1;
            return Math.max(1, 45 - Math.min(gaps, 20) * 1.5 - Math.min(first, 40) * 0.3);
        }

        function buildIndex() {
            searchIndex = state.posts.map((post, i) => ({
                i,
                text: norm(post.text),
                author: norm(post.author),
                raw: post.text || '',
                rawAuthor: post.author || '',
                date: post.date || '',
                image: post.image || '',
            }));
        }

        function searchPosts(query) {
            if (!searchIndex || searchIndex.length !== state.posts.length) buildIndex();
            searchTokens = norm(query).split(/\s+/).filter(Boolean);
            if (!searchTokens.length) return [];

            const hits = [];
            for (const rec of searchIndex) {
                let score = 0, inAuthor = 0, ok = true;
                for (const tok of searchTokens) {
                    const st = tokenScore(rec.text, tok);
                    const sa = tokenScore(rec.author, tok);
                    const best = Math.max(st, sa);
                    if (best < 0) { ok = false; break; }
                    score += best;
                    if (sa >= 0 && sa >= st) inAuthor++;
                }
                if (!ok) continue;
                if (inAuthor === searchTokens.length) score += 25;  // the author matched every word
                hits.push({ rec, score });
            }
            return hits.sort((a, b) => b.score - a.score || a.rec.i - b.rec.i);
        }

        /* Same normalisation as `norm`, but keeping a map from each normalised
           character back to its offset in the original string. That is what
           lets a hit on "così" be found by the query "cosi" and still be
           highlighted in the original text. */
        function normMap(s) {
            let out = '';
            const map = [];
            let i = 0;
            for (const ch of s) {
                const n = ch.normalize('NFKC').toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                for (let k = 0; k < n.length; k++) { out += n[k]; map.push(i); }
                i += ch.length;
            }
            return { out, map };
        }

        /* A window around the first hit, so a result shows *why* it matched
           instead of always the opening line of the post. */
        function snippetFor(raw) {
            const SPAN = 170, PAD = 55;
            const { out, map } = normMap(raw);

            let hit = -1;
            for (const tok of searchTokens) {
                const p = out.indexOf(tok);
                if (p >= 0 && (hit < 0 || p < hit)) hit = p;
            }
            if (hit < 0) {
                return raw.slice(0, SPAN).replace(/\s+/g, ' ').trim() + (raw.length > SPAN ? '…' : '');
            }

            const start = Math.max(0, map[hit] - PAD);
            const end = Math.min(raw.length, start + SPAN);
            return (start > 0 ? '… ' : '')
                + raw.slice(start, end).replace(/\s+/g, ' ').trim()
                + (end < raw.length ? ' …' : '');
        }

        /* Wrap every occurrence of every word in <mark>, accent-insensitively. */
        function highlighted(raw) {
            const { out, map } = normMap(raw);
            const ranges = [];
            for (const tok of searchTokens) {
                let from = 0, p;
                while ((p = out.indexOf(tok, from)) >= 0) {
                    const a = map[p];
                    const b = p + tok.length < map.length
                        ? Math.max(map[p + tok.length], map[p + tok.length - 1] + 1)
                        : raw.length;
                    if (b > a) ranges.push([a, b]);
                    from = p + tok.length;
                    if (ranges.length > 40) break;
                }
            }
            if (!ranges.length) return esc(raw);

            ranges.sort((a, b) => a[0] - b[0]);
            let html = '', last = 0;
            for (const [a, b] of ranges) {
                if (b <= last) continue;
                const from = Math.max(a, last);
                html += esc(raw.slice(last, from)) + '<mark>' + esc(raw.slice(from, b)) + '</mark>';
                last = b;
            }
            return html + esc(raw.slice(last));
        }

        function paintResults(hits, query) {
            const box = els.results;
            if (!query) {
                box.classList.add('hidden');
                box.innerHTML = '';
                activeResult = -1;
                return;
            }

            if (!hits.length) {
                box.innerHTML = `<div class="px-4 py-3 text-sm text-stone-500">Nessun ricordo per «${esc(query)}»</div>`;
                box.classList.remove('hidden');
                activeResult = -1;
                return;
            }

            box.innerHTML = hits.slice(0, SEARCH_MAX).map(({ rec }) => {
                const thumb = rec.image
                    ? `<img src="${esc(rec.image)}" alt="" loading="lazy"
                            class="h-11 w-11 rounded-md object-cover shrink-0 bg-stone-900">`
                    : `<span class="h-11 w-11 rounded-md shrink-0 bg-white/5 border border-white/10"></span>`;
                return `
                    <button type="button" role="option" data-i="${rec.i}" aria-selected="false"
                            class="w-full text-left px-3 py-2.5 flex gap-3 items-start border-b border-white/5 last:border-0
                                   hover:bg-white/5 focus:outline-none transition-colors">
                        ${thumb}
                        <span class="min-w-0 flex-1">
                            <span class="flex items-baseline gap-2">
                                <span class="text-stone-100 text-sm font-medium truncate">${esc(rec.rawAuthor)}</span>
                                ${rec.date ? `<span class="text-[0.6rem] text-stone-500 uppercase tracking-wider truncate max-w-[45%]">${esc(rec.date)}</span>` : ''}
                            </span>
                            <span class="mt-1 block text-[0.78rem] leading-snug text-stone-400">${highlighted(snippetFor(rec.raw))}</span>
                        </span>
                    </button>`;
            }).join('') + (hits.length > SEARCH_MAX
                ? `<div class="px-4 py-2 text-[0.7rem] text-stone-500">altri ${hits.length - SEARCH_MAX} ricordi</div>`
                : '');

            box.classList.remove('hidden');
            activeResult = 0;
            paintActive();
        }

        const resultButtons = () => Array.from(els.results.querySelectorAll('button[data-i]'));

        function paintActive() {
            resultButtons().forEach((b, n) => {
                const on = n === activeResult;
                b.setAttribute('aria-selected', on ? 'true' : 'false');
                if (on) b.scrollIntoView({ block: 'nearest' });
            });
        }

        function closeResults() {
            els.results.classList.add('hidden');
            els.results.innerHTML = '';
            activeResult = -1;
        }

        function jumpTo(index) {
            closeResults();
            els.search.blur();
            go(index);
        }

        function onSearchInput() {
            const q = els.search.value.trim();
            paintResults(q ? searchPosts(q) : [], q);
        }

        els.search.addEventListener('input', onSearchInput);

        // Coming back to the box re-opens the last search instead of looking dead.
        els.search.addEventListener('focus', () => {
            if (els.search.value.trim()) onSearchInput();
        });

        els.search.addEventListener('keydown', (event) => {
            const btns = resultButtons();
            if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                if (!btns.length) return;
                event.preventDefault();
                const dir = event.key === 'ArrowDown' ? 1 : -1;
                activeResult = (activeResult + dir + btns.length) % btns.length;
                paintActive();
            } else if (event.key === 'Enter') {
                event.preventDefault();
                const target = btns[activeResult >= 0 ? activeResult : 0];
                if (target) jumpTo(Number(target.dataset.i));
            } else if (event.key === 'Escape') {
                event.preventDefault();
                if (els.search.value) {
                    els.search.value = '';
                    onSearchInput();
                } else {
                    closeResults();
                    els.search.blur();
                }
            }
        });

        els.results.addEventListener('click', (event) => {
            const btn = event.target.closest('button[data-i]');
            if (btn) jumpTo(Number(btn.dataset.i));
        });

        els.results.addEventListener('mousemove', (event) => {
            const btn = event.target.closest('button[data-i]');
            if (!btn) return;
            const n = resultButtons().indexOf(btn);
            if (n >= 0 && n !== activeResult) {
                activeResult = n;
                paintActive();
            }
        });

        document.addEventListener('click', (event) => {
            if (!els.searchWrap.contains(event.target)) closeResults();
        });

        // ⌘K / Ctrl-K opens the search from anywhere.
        document.addEventListener('keydown', (event) => {
            if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                els.search.focus();
                els.search.select();
            }
        });

        document.addEventListener('keydown', (event) => {
            const k = event.key;

            // Everything typed in the search box belongs to the search box.
            if (event.target && event.target.closest && event.target.closest('#search-wrap')) return;

            // Let Enter/Space activate a focused link (author, original post)
            // instead of silently advancing.
            const interactive = event.target && event.target.closest
                && event.target.closest('a, button, input, textarea, select');
            if (interactive && (k === 'Enter' || k === ' ')) return;

            if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'Enter') {
                event.preventDefault();
                nextPost();
            } else if (k === 'ArrowLeft' || k === 'ArrowUp') {
                event.preventDefault();
                prevPost();
            } else if (k === 'Home') {
                event.preventDefault();
                go(0);
            } else if (k === 'End') {
                event.preventDefault();
                go(state.posts.length - 1);
            }
        });

        function showMessage(html) {
            els.text.textContent = '';
            els.card.innerHTML =
                `<div class="my-auto text-stone-400 text-sm leading-relaxed">${html}</div>`;
        }

        async function init() {
            try {
                state.posts = normalise(await loadPosts());
                if (!state.posts.length) {
                    showMessage('Nessun ricordo da mostrare.');
                    return;
                }
                // A link like .../#fb_123 opens straight on that memory.
                // render() always runs: when the link points at the first slide,
                // state.i is already 0 and goToHash() alone would paint nothing.
                const fromHash = indexFromHash();
                state.i = fromHash >= 0 ? fromHash : 0;
                render();
                syncHash();
            } catch (err) {
                // file:// blocks fetch(); say so instead of showing a blank page.
                showMessage(`
                    <strong class="block mb-2 text-stone-100">Impossibile caricare ${DATA_URL}</strong>
                    ${err.message}<br><br>
                    Apri questa pagina da un server locale, non con doppio clic:
                    <code class="block mt-2 p-3 bg-white/5 rounded select-all">python3 -m http.server 8899</code>
                    poi vai su <code>http://localhost:8899/</code>.
                `);
            }
        }

        init();
    </script>
</body>
</html>

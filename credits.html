<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crediti — Per Annibale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            800: '#292524',
                            900: '#1c1917',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html { height: 100%; }

        /* Same ground as the slideshow, but this page scrolls normally. */
        body {
            min-height: 100%;
            background-color: #0b0a09;
            background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed;
            color: #e7e5e4;
        }

        /* Sticky header stays liquid over the page. */
        .topbar {
            background: rgba(11, 10, 9, 0.72);
            backdrop-filter: blur(12px) saturate(140%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }
    </style>
</head>
<body class="text-stone-200 antialiased">

    <header class="topbar sticky top-0 z-40">
        <div class="mx-auto grid w-full max-w-5xl grid-cols-[auto_1fr] lg:grid-cols-[1fr_auto_1fr] items-center
                    gap-x-4 gap-y-2 px-4 md:px-8 py-3">
            <p class="col-start-1 row-start-1 text-stone-500 uppercase tracking-[0.2em] text-[0.7rem] md:text-xs">
                PER ANNIBALE
            </p>

            <nav aria-label="Sezioni del sito"
                 class="col-span-2 row-start-2 flex items-center justify-center gap-1.5 text-[0.72rem]
                        lg:col-span-1 lg:col-start-2 lg:row-start-1">
                <a href="index.html"
                   class="rounded-full border border-transparent px-2.5 py-1 text-stone-500 transition-colors hover:bg-white/5 hover:text-stone-200">Ricordi</a>
                <a href="video.html"
                   class="rounded-full border border-transparent px-2.5 py-1 text-stone-500 transition-colors hover:bg-white/5 hover:text-stone-200">Video</a>
                <a href="credits.html" aria-current="page"
                   class="rounded-full border border-white/15 bg-white/10 px-2.5 py-1 text-stone-100">Crediti</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto w-full max-w-3xl px-4 md:px-8 pb-20">

        <div class="pt-10 md:pt-16 pb-6 md:pb-10">
            <h1 class="font-serif text-2xl md:text-4xl text-stone-100 leading-tight">Crediti</h1>
        </div>

        <section class="pt-2">
            <h2 class="text-stone-500 uppercase tracking-[0.18em] text-[0.7rem] md:text-xs
                       border-b border-white/10 pb-2 mb-5">
                Un'idea di
            </h2>
            <ul class="font-serif text-lg md:text-2xl text-stone-100 leading-relaxed">
                <li>Mariella Stella</li>
                <li>Danilo Di Cuia</li>
            </ul>
        </section>

        <section class="pt-10 md:pt-12">
            <h2 class="text-stone-500 uppercase tracking-[0.18em] text-[0.7rem] md:text-xs
                       border-b border-white/10 pb-2 mb-5">
                Contributi
            </h2>
            <ul class="font-serif text-lg md:text-2xl text-stone-100 leading-relaxed">
                <li>Alessandro Tartaglia</li>
                <li>Andrea Di Benedetto</li>
            </ul>
        </section>

        <p class="mt-14 pt-6 border-t border-white/10 text-center text-xs text-stone-500 font-light">
            <a href="index.html" class="text-stone-400 underline decoration-white/20 underline-offset-4
                                       transition-colors hover:text-stone-100">Torna ai ricordi</a>
        </p>
    </main>

</body>
</html>

    <script>
        /* One player, one list: choosing a song loads that track into the Spotify embed. */
        (function playlist() {
            const player = document.getElementById('player');
            const list = document.getElementById('list');
            if (!player || !list) return;

            function play(button) {
                list.querySelectorAll('.playlist__item').forEach((el) => {
                    el.setAttribute('aria-current', el === button ? 'true' : 'false');
                });

                const iframe = document.createElement('iframe');
                iframe.src = 'https://open.spotify.com/embed/track/' + button.dataset.track +
                             '?utm_source=generator&theme=0&autoplay=1';
                iframe.title = button.dataset.title + ' · ' + button.dataset.artist;
                iframe.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
                player.replaceChildren(iframe);
            }

            list.addEventListener('click', (event) => {
                const button = event.target.closest('.playlist__item');
                if (button) play(button);
            });
        })();
    </script>
